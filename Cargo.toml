[workspace]
resolver = "2"
members = [
    "crates/scour-core",
    "crates/scour-cli",
    "crates/scour-tui",
    "crates/scour-helperd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["scour contributors"]
repository = ""

[workspace.dependencies]
scour-core = { path = "crates/scour-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
walkdir = "2"
jwalk = "0.8"
blake3 = "1"
rayon = "1"
humansize = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
